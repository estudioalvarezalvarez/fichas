<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Alvarez &amp; Alvarez – Fichas</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0f5c4d">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f4ef;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a66;--ac:#0f5c4d;--on:#fff;--bd:#dcdad2;--ok:#17803d;--no:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151614;--sf:#202220;--tx:#ecebe6;--mu:#a3a29b;--ac:#4cc3a8;--on:#0b1f1a;--bd:#363832;--ok:#5fd68a;--no:#ff8f86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151614;--sf:#202220;--tx:#ecebe6;--mu:#a3a29b;--ac:#4cc3a8;--on:#0b1f1a;--bd:#363832;--ok:#5fd68a;--no:#ff8f86;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:16px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 0}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:3px}
textarea{min-height:90px}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:var(--on);font-weight:600}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.x{background:transparent;color:var(--no);padding:6px 8px}
.tabs{display:flex;gap:4px;margin:8px 0}.tabs button{flex:1;padding:9px 2px;font-size:14px;background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:var(--on)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.big{font-size:22px;font-weight:700}.ok{color:var(--ok);font-weight:700}.no{color:var(--no);font-weight:700}.mu{color:var(--mu);font-size:13px}
.brand{background:#fff;border-radius:12px;padding:6px;text-align:center;margin-bottom:10px}.brand img{display:block;margin:0 auto;max-width:100%;height:auto;max-height:120px}.sc{overflow-x:auto}.cl{width:100%;text-align:left;background:var(--sf);color:var(--tx);border:1px solid var(--bd);margin:6px 0}
</style></head><body><div id="app"></div>

function vRes(c,r){const ok=r.okE&&r.okA,fa=Math.max(0,(r.edP-r.age)*12);return`<div class="card"><div class="mu">Estado del trámite</div><div class="${ok?"ok":"no"} big">${ok?"Derecho adquirido (prorrateo)":"No completa requisitos"}</div></div>
<h2>Haber jubilatorio</h2><div class="card"><div class="row"><span>Haber promedio</span><b>$ ${f2(r.prom)}</b></div><div class="row"><span>PBU</span><b>$ ${f2(r.PBU)}</b></div><div class="row"><span>PC (hasta 06/94)</span><b>$ ${f2(r.PC)}</b></div><div class="row"><span>PAP (desde 07/94)</span><b>$ ${f2(r.PAP)}</b></div><div class="row"><span>Total</span><b class="big">$ ${f2(r.T)}</b></div></div>
<h2>Prorrateo</h2><div class="card"><div class="row"><span>Aportes diferenciales</span><b>${r.dY.toFixed(2)} años</b></div><div class="row"><span>Aportes comunes (con exceso de edad)</span><b>${r.cY.toFixed(2)} años</b></div><div class="row"><span>Total efectivo</span><b>${r.ef.toFixed(2)} años</b></div><div class="row"><span>Fracción diferencial</span><b>${(r.f*100).toFixed(1)} %</b></div>
<div class="row"><span>Edad mínima prorrateada</span><b>${r.edP.toFixed(2)}</b></div><div class="row"><span>Aportes requeridos prorrateados</span><b>${r.apP.toFixed(2)}</b></div>
<div class="row"><span>Edad</span><b class="${r.okE?"ok":"no"}">${r.okE?"Cumplida":"Faltan "+ya(Math.round(fa))}</b></div><div class="row"><span>Aportes</span><b class="${r.okA?"ok":"no"}">${r.okA?"Cumplidos":"Faltan "+(r.apP-r.ef).toFixed(1)+" años"}</b></div></div>`}
function R(){const c=cur(),el=$("#app");
 if(!c){el.innerHTML=`${B}<h1>Fichas de clientes</h1>${S.c.map(x=>`<button class="cl" onclick="abrir(${x.id})">${esc(x.nombre||"Sin nombre")}<div class="mu">${esc(x.cuil)}</div></button>`).join("")||'<div class="mu">Todavía no hay fichas.</div>'}<button onclick="nuevo()" style="margin-top:8px">+ Nueva ficha</button>
 <h2>Respaldo</h2><div class="card"><textarea id="bk" onfocus="this.select()">${esc(JSON.stringify(S))}</textarea><div class="mu">Copiá este texto para guardar tus fichas, o pegá un respaldo y tocá Cargar.</div><button class="s" onclick="bk()" style="margin-top:8px">Cargar respaldo</button></div>`;return}
 const r=calc(c),v={ficha:vFicha,aportes:vAp,haber:vHa,res:vRes}[tab];
 el.innerHTML=`${B}<button class="s" onclick="volver()">‹ Fichas</button><h1>${esc(c.nombre||"Nueva ficha")}</h1><div class="tabs">${[["ficha","Ficha"],["aportes","Aportes"],["haber","Haber"],["res","Resultado"]].map(t=>`<button class="${tab==t[0]?"on":""}" onclick="T('${t[0]}')">${t[1]}</button>`).join("")}</div>${v(c,r)}`}
R();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
